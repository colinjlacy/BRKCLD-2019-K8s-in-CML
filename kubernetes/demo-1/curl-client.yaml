apiVersion: v1
kind: Pod
metadata:
  name: curl-client
  labels:
    app: curl-client
spec:
  containers:
    - name: curl-client
      image: docker.io/curlimages/curl:8.11.1
      imagePullPolicy: IfNotPresent
      command:
        - sleep
        - infinity
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
