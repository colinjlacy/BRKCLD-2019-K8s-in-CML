---
- name: Wait for SSH on K3s nodes from mgmt
  hosts: k8s_nodes
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Wait for port 22
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        delay: 0
        sleep: 5
        timeout: 1200
      delegate_to: localhost

- name: Linux prep for K3s
  hosts: k8s_nodes
  become: true
  tasks:
    - name: Ensure kernel modules for Kubernetes
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Load modules now
      ansible.builtin.command: modprobe {{ item }}
      changed_when: true
      failed_when: false
      loop:
        - overlay
        - br_netfilter

    - name: Sysctl for Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        mode: "0644"

    - name: Apply sysctl
      ansible.builtin.command: sysctl -p /etc/sysctl.d/99-kubernetes.conf
      changed_when: true

    - name: Disable swap
      ansible.builtin.command: swapoff -a
      changed_when: true
      failed_when: false

    - name: Remove swap from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        state: absent
        regexp: '^[^#]*\sswap\s'

    - name: Wait for apt/dpkg locks to clear
      ansible.builtin.shell: |
        end=$((SECONDS + 1200))
        while [ "$SECONDS" -lt "$end" ]; do
          held=0
          if command -v fuser >/dev/null 2>&1; then
            fuser /var/lib/apt/lists/lock >/dev/null 2>&1 && held=1 || true
            fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 && held=1 || true
            fuser /var/lib/dpkg/lock >/dev/null 2>&1 && held=1 || true
          else
            pgrep -x apt-get >/dev/null 2>&1 && held=1 || true
            pgrep -x apt >/dev/null 2>&1 && held=1 || true
            pgrep -f unattended-upgrade >/dev/null 2>&1 && held=1 || true
          fi
          if [ "$held" -eq 0 ]; then
            exit 0
          fi
          sleep 5
        done
        echo "Timed out waiting for apt/dpkg locks to clear" >&2
        exit 1
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install curl for K3s install script
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true

- name: Install K3s server for Cilium
  hosts: k8s_control
  become: true
  tasks:
    - name: Install K3s server without bundled CNI or kube-proxy
      ansible.builtin.shell: |
        set -e
        curl -sfL https://get.k3s.io | sh -s - server \
          --flannel-backend=none \
          --disable-network-policy \
          --disable-kube-proxy \
          --disable=traefik,servicelb \
          --cluster-cidr={{ k3s_cluster_cidr }} \
          --service-cidr={{ k3s_service_cidr }} \
          --node-ip={{ ansible_host }} \
          --tls-san={{ ansible_host }} \
          --write-kubeconfig-mode=0644 \
          --kubelet-arg=serialize-image-pulls=true
      args:
        creates: /etc/systemd/system/k3s.service

    - name: Enable and start k3s
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

- name: Wait for Kubernetes API
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: Wait for 6443 on k8s-cp
      ansible.builtin.wait_for:
        host: "{{ hostvars['k8s-cp'].k3s_cp_api_ip }}"
        port: 6443
        timeout: 300

- name: Read K3s join token
  hosts: k8s_control
  gather_facts: false
  become: true
  tasks:
    - name: Slurp node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_slurp

    - name: Publish token as host fact for workers
      ansible.builtin.set_fact:
        k3s_join_token: "{{ k3s_token_slurp.content | b64decode | trim }}"

- name: Join K3s agents
  hosts: k8s_workers
  become: true
  vars:
    k3s_join_token: "{{ hostvars['k8s-cp']['k3s_join_token'] }}"
  tasks:
    - name: Install K3s agent
      ansible.builtin.shell: |
        set -e
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ k3s_cp_api_ip }}:6443 K3S_TOKEN="{{ k3s_join_token }}" sh -s - agent \
          --node-ip={{ ansible_host }} \
          --kubelet-arg=serialize-image-pulls=true
      args:
        creates: /etc/systemd/system/k3s-agent.service

    - name: Enable and start k3s-agent
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: started

- name: Fetch kubeconfig and install kubectl on mgmt
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    kube_dir: /home/cisco/.kube
  tasks:
    - name: Detect architecture for kubectl
      ansible.builtin.command: uname -m
      register: mgmt_uname_m
      changed_when: false

    - name: Set kubectl download arch
      ansible.builtin.set_fact:
        kubectl_dl_arch: "{{ 'arm64' if mgmt_uname_m.stdout in ['aarch64', 'arm64'] else 'amd64' }}"

    - name: Fetch kubectl stable version
      ansible.builtin.uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: true
      register: kubectl_stable_ver

    - name: Install kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_stable_ver.content | trim }}/bin/linux/{{ kubectl_dl_arch }}/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"
      become: true

    - name: Ensure kubeconfig directory
      ansible.builtin.file:
        path: "{{ kube_dir }}"
        state: directory
        mode: "0700"

    - name: Slurp kubeconfig from control plane
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      delegate_to: k8s-cp
      become: true
      register: kubeconfig

    - name: Write kubeconfig on mgmt
      ansible.builtin.copy:
        dest: "{{ kube_dir }}/config"
        content: "{{ kubeconfig.content | b64decode | replace('127.0.0.1', hostvars['k8s-cp'].k3s_cp_api_ip) }}"
        mode: "0600"

- name: Install Helm on mgmt
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: Download Helm install script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm-3
        mode: "0755"

    - name: Install Helm 3 to /usr/local/bin
      ansible.builtin.command: /tmp/get-helm-3
      args:
        creates: /usr/local/bin/helm

- name: Install Cilium CLI on mgmt
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: Detect architecture for Cilium CLI
      ansible.builtin.command: uname -m
      register: cilium_uname_m
      changed_when: false

    - name: Set Cilium CLI download arch
      ansible.builtin.set_fact:
        cilium_cli_arch: "{{ 'arm64' if cilium_uname_m.stdout in ['aarch64', 'arm64'] else 'amd64' }}"

    - name: Fetch latest Cilium CLI version
      ansible.builtin.uri:
        url: https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt
        return_content: true
      register: cilium_cli_version

    - name: Download Cilium CLI tarball
      ansible.builtin.get_url:
        url: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version.content | trim }}/cilium-linux-{{ cilium_cli_arch }}.tar.gz"
        dest: "/tmp/cilium-cli-{{ cilium_cli_version.content | trim }}.tar.gz"
        mode: "0644"

    - name: Install Cilium CLI to /usr/local/bin
      ansible.builtin.unarchive:
        src: "/tmp/cilium-cli-{{ cilium_cli_version.content | trim }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        creates: /usr/local/bin/cilium

- name: Install Cilium with Helm
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    kube_cfg: /home/cisco/.kube/config
    cilium_values_file: /tmp/cilium-values.yaml
    cilium_bgp_resources_file: /tmp/cilium-bgp-control-plane.yaml
    curl_target_manifest: /tmp/curl-target.yaml
    workload_prepull_images:
      - docker.io/nginxinc/nginx-unprivileged:1.27-alpine
      - docker.io/curlimages/curl:8.11.1
  tasks:
    - name: Add and update Cilium Helm repo
      ansible.builtin.shell: |
        set -e
        helm repo add cilium https://helm.cilium.io/ 2>/dev/null || true
        helm repo update
      changed_when: true

    - name: Write Cilium Helm values
      ansible.builtin.copy:
        dest: "{{ cilium_values_file }}"
        mode: "0644"
        content: |
          cluster:
            name: {{ hostvars['k8s-cp'].cilium_cluster_name }}
            id: {{ hostvars['k8s-cp'].cilium_cluster_id }}
          kubeProxyReplacement: true
          ipam:
            mode: cluster-pool
            operator:
              clusterPoolIPv4PodCIDRList:
                - {{ cilium_cluster_pool_ipv4_cidr }}
              clusterPoolIPv4MaskSize: {{ cilium_cluster_pool_ipv4_mask_size }}
          routingMode: tunnel
          tunnelProtocol: vxlan
          autoDirectNodeRoutes: false
          l2announcements:
            enabled: true
          bgpControlPlane:
            enabled: true
          k8sServiceHost: {{ hostvars['k8s-cp'].k3s_cp_api_ip }}
          k8sServicePort: 6443
          hubble:
            enabled: true
            relay:
              enabled: true
            ui:
              enabled: true
              service:
                type: LoadBalancer

    - name: Render Cilium chart and collect exact image references
      ansible.builtin.shell: |
        set -euo pipefail
        helm template cilium cilium/cilium \
          --version "{{ cilium_helm_chart_version }}" \
          --namespace kube-system \
          --values "{{ cilium_values_file }}" |
          awk '/image:/ { gsub(/"/, "", $2); if ($2 != "") print $2 }' |
          sort -u
      args:
        executable: /bin/bash
      register: cilium_prepull_images
      changed_when: false

    - name: Pre-pull Cilium and workload images on K3s nodes
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - ctr
          - --namespace
          - k8s.io
          - images
          - pull
          - "{{ item.1 }}"
      become: true
      delegate_to: "{{ item.0 }}"
      loop: "{{ groups['k8s_nodes'] | product((cilium_prepull_images.stdout_lines + workload_prepull_images) | unique) | list }}"

    - name: Reconcile Cilium Helm release
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - cilium
          - cilium/cilium
          - --version
          - "{{ cilium_helm_chart_version }}"
          - --namespace
          - kube-system
          - --create-namespace
          - --values
          - "{{ cilium_values_file }}"
      environment:
        KUBECONFIG: "{{ kube_cfg }}"

    - name: Wait for Cilium to be ready
      ansible.builtin.command: cilium status --wait
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      changed_when: false

    - name: Write Cilium BGP control plane resources
      ansible.builtin.copy:
        dest: "{{ cilium_bgp_resources_file }}"
        mode: "0644"
        content: |
          apiVersion: cilium.io/v2alpha1
          kind: CiliumLoadBalancerIPPool
          metadata:
            name: lb-pool
          spec:
            blocks:
              - start: "{{ cilium_lb_pool_start }}"
                stop: "{{ cilium_lb_pool_stop }}"
          ---
          apiVersion: cilium.io/v2
          kind: CiliumBGPPeerConfig
          metadata:
            name: lab-router-peer
          spec:
            families:
              - afi: ipv4
                safi: unicast
                advertisements:
                  matchLabels:
                    advertise: bgp
          ---
          apiVersion: cilium.io/v2
          kind: CiliumBGPClusterConfig
          metadata:
            name: lab-router
          spec:
            nodeSelector:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: Exists
            bgpInstances:
              - name: instance-{{ cilium_bgp_local_asn }}
                localASN: {{ cilium_bgp_local_asn }}
                peers:
                  - name: lab-router
                    peerASN: {{ cilium_bgp_peer_asn }}
                    peerAddress: {{ cilium_bgp_peer_address }}
                    peerConfigRef:
                      name: lab-router-peer
          ---
          apiVersion: cilium.io/v2
          kind: CiliumBGPAdvertisement
          metadata:
            name: lab-advertisements
            labels:
              advertise: bgp
          spec:
            advertisements:
              - advertisementType: PodCIDR
              - advertisementType: Service
                service:
                  addresses:
                    - LoadBalancerIP
                selector:
                  matchExpressions:
                    - key: somekey
                      operator: NotIn
                      values:
                        - never-used-value

    - name: Apply Cilium BGP control plane resources
      ansible.builtin.command: kubectl apply -f "{{ cilium_bgp_resources_file }}"
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      register: cilium_bgp_apply
      changed_when: "'created' in cilium_bgp_apply.stdout or 'configured' in cilium_bgp_apply.stdout"

    - name: Show Cilium BGP control plane resources
      ansible.builtin.command: kubectl get ciliumbgpclusterconfigs,ciliumbgppeerconfigs,ciliumbgpadvertisements
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      register: cilium_bgp_resources
      changed_when: false

    - name: Display Cilium BGP control plane resources
      ansible.builtin.debug:
        var: cilium_bgp_resources.stdout_lines

    - name: Write curl target manifest
      ansible.builtin.copy:
        dest: "{{ curl_target_manifest }}"
        mode: "0644"
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: curl-target-nginx
          data:
            default.conf: |
              server {
                listen 8080;
                server_name _;

                location / {
                  default_type text/plain;
                  return 200 "curl-target\n";
                }
              }
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: curl-target
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: curl-target
            template:
              metadata:
                labels:
                  app: curl-target
              spec:
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: nginx
                    image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
                    imagePullPolicy: IfNotPresent
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    ports:
                      - containerPort: 8080
                    volumeMounts:
                      - name: nginx-config
                        mountPath: /etc/nginx/conf.d/default.conf
                        subPath: default.conf
                        readOnly: true
                volumes:
                  - name: nginx-config
                    configMap:
                      name: curl-target-nginx
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: curl-target
          spec:
            selector:
              app: curl-target
            ports:
              - name: http
                port: 80
                targetPort: 8080

    - name: Apply curl target manifest
      ansible.builtin.command: kubectl apply -f "{{ curl_target_manifest }}"
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      register: curl_target_apply
      changed_when: "'created' in curl_target_apply.stdout or 'configured' in curl_target_apply.stdout"

    - name: Wait for curl target deployment
      ansible.builtin.command: kubectl rollout status deployment/curl-target --timeout=300s
      environment:
        KUBECONFIG: "{{ kube_cfg }}"

    - name: Validate K3s nodes
      ansible.builtin.command: kubectl get nodes
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      register: k3s_nodes
      changed_when: false

    - name: Show K3s nodes
      ansible.builtin.debug:
        var: k3s_nodes.stdout_lines
