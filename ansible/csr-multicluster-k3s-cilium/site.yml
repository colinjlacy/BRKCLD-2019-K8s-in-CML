---
- name: Wait for SSH on K3s nodes from mgmt
  hosts: k8s_nodes
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Wait for port 22
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        delay: 0
        sleep: 5
        timeout: 1200
      delegate_to: localhost

- name: Linux prep for K3s
  hosts: k8s_nodes
  become: true
  tasks:
    - name: Ensure kernel modules for Kubernetes
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Load modules now
      ansible.builtin.command: modprobe {{ item }}
      changed_when: true
      failed_when: false
      loop:
        - overlay
        - br_netfilter

    - name: Sysctl for Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        mode: "0644"

    - name: Apply sysctl
      ansible.builtin.command: sysctl -p /etc/sysctl.d/99-kubernetes.conf
      changed_when: true

    - name: Disable swap
      ansible.builtin.command: swapoff -a
      changed_when: true
      failed_when: false

    - name: Remove swap from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        state: absent
        regexp: '^[^#]*\sswap\s'

    - name: Wait for apt/dpkg locks to clear
      ansible.builtin.shell: |
        end=$((SECONDS + 1200))
        while [ "$SECONDS" -lt "$end" ]; do
          held=0
          if command -v fuser >/dev/null 2>&1; then
            fuser /var/lib/apt/lists/lock >/dev/null 2>&1 && held=1 || true
            fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 && held=1 || true
            fuser /var/lib/dpkg/lock >/dev/null 2>&1 && held=1 || true
          else
            pgrep -x apt-get >/dev/null 2>&1 && held=1 || true
            pgrep -x apt >/dev/null 2>&1 && held=1 || true
            pgrep -f unattended-upgrade >/dev/null 2>&1 && held=1 || true
          fi
          if [ "$held" -eq 0 ]; then
            exit 0
          fi
          sleep 5
        done
        echo "Timed out waiting for apt/dpkg locks to clear" >&2
        exit 1
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install curl for K3s install script
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true

    - name: Ensure K3s config directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Enable K3s distributed mirroring for all registries
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/registries.yaml
        content: |
          mirrors:
            "*":
        mode: "0644"
      register: k3s_registries_yaml

    - name: Restart K3s services when registry mirror config changes
      ansible.builtin.shell: |
        systemctl try-restart k3s || true
        systemctl try-restart k3s-agent || true
      changed_when: true
      when: k3s_registries_yaml.changed

- name: Install K3s servers for Cilium
  hosts: k8s_control
  become: true
  tasks:
    - name: Install K3s server without bundled CNI or kube-proxy
      ansible.builtin.shell: |
        set -e
        curl -sfL https://get.k3s.io | sh -s - server \
          --flannel-backend=none \
          --disable-network-policy \
          --disable-kube-proxy \
          --disable=traefik,servicelb \
          --cluster-cidr={{ k3s_cluster_cidr }} \
          --service-cidr={{ k3s_service_cidr }} \
          --node-ip={{ ansible_host }} \
          --tls-san={{ ansible_host }} \
          --write-kubeconfig-mode=0644 \
          --embedded-registry \
          --kubelet-arg=serialize-image-pulls=true
      args:
        creates: /etc/systemd/system/k3s.service

    - name: Enable and start k3s
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

- name: Wait for Kubernetes APIs
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: Wait for cluster A API
      ansible.builtin.wait_for:
        host: "{{ hostvars['k8s-a-cp'].k3s_cp_api_ip }}"
        port: 6443
        timeout: 300

    - name: Wait for cluster B API
      ansible.builtin.wait_for:
        host: "{{ hostvars['k8s-b-cp'].k3s_cp_api_ip }}"
        port: 6443
        timeout: 300

- name: Read K3s join tokens
  hosts: k8s_control
  gather_facts: false
  become: true
  tasks:
    - name: Slurp node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_slurp

    - name: Publish token as host fact for workers
      ansible.builtin.set_fact:
        k3s_join_token: "{{ k3s_token_slurp.content | b64decode | trim }}"

- name: Join K3s agents
  hosts: k8s_workers
  become: true
  vars:
    k3s_join_token: "{{ hostvars['k8s-a-cp']['k3s_join_token'] if inventory_hostname in groups['k8s_a_workers'] else hostvars['k8s-b-cp']['k3s_join_token'] }}"
  tasks:
    - name: Remove unsupported embedded registry flag from existing agents
      ansible.builtin.shell: |
        set -e
        changed=0
        for f in /etc/systemd/system/k3s-agent.service /etc/systemd/system/k3s-agent.service.env; do
          if [ -f "$f" ] && grep -q -- '--embedded-registry' "$f"; then
            sed -i '/--embedded-registry/d' "$f"
            changed=1
          fi
        done
        if [ "$changed" -eq 1 ]; then
          systemctl daemon-reload
          echo changed
        fi
      register: k3s_agent_embedded_registry_repair
      changed_when: "'changed' in k3s_agent_embedded_registry_repair.stdout"

    - name: Install K3s agent
      ansible.builtin.shell: |
        set -e
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ k3s_cp_api_ip }}:6443 K3S_TOKEN="{{ k3s_join_token }}" sh -s - agent \
          --node-ip={{ ansible_host }} \
          --kubelet-arg=serialize-image-pulls=true
      args:
        creates: /etc/systemd/system/k3s-agent.service

    - name: Enable and start k3s-agent
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: started

- name: Pre-pull curl target image on site A nodes
  hosts: k8s_a_control:k8s_a_workers
  become: true
  vars:
    curl_target_image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
  tasks:
    - name: Pre-pull curl target image with K3s containerd
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - ctr
          - --namespace
          - k8s.io
          - images
          - pull
          - "{{ curl_target_image }}"

- name: Pre-pull curl client image on site B nodes
  hosts: k8s_b_control:k8s_b_workers
  become: true
  vars:
    curl_client_image: docker.io/curlimages/curl:8.11.1
  tasks:
    - name: Pre-pull curl client image with K3s containerd
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - ctr
          - --namespace
          - k8s.io
          - images
          - pull
          - "{{ curl_client_image }}"

- name: Fetch kubeconfigs and install kubectl on mgmt
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    kube_dir: /home/cisco/.kube
  tasks:
    - name: Detect architecture for kubectl
      ansible.builtin.command: uname -m
      register: mgmt_uname_m
      changed_when: false

    - name: Set kubectl download arch
      ansible.builtin.set_fact:
        kubectl_dl_arch: "{{ 'arm64' if mgmt_uname_m.stdout in ['aarch64', 'arm64'] else 'amd64' }}"

    - name: Fetch kubectl stable version
      ansible.builtin.uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: true
      register: kubectl_stable_ver

    - name: Install kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_stable_ver.content | trim }}/bin/linux/{{ kubectl_dl_arch }}/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"
      become: true

    - name: Download Cilium CLI tarball
      ansible.builtin.get_url:
        url: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}/cilium-linux-{{ kubectl_dl_arch }}.tar.gz"
        dest: /tmp/cilium-cli.tar.gz
        mode: "0644"

    - name: Extract Cilium CLI
      ansible.builtin.unarchive:
        src: /tmp/cilium-cli.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install Cilium CLI
      ansible.builtin.copy:
        src: /tmp/cilium
        dest: /usr/local/bin/cilium
        mode: "0755"
        remote_src: true
      become: true

    - name: Ensure kubeconfig directory
      ansible.builtin.file:
        path: "{{ kube_dir }}"
        state: directory
        mode: "0700"

    - name: Slurp kubeconfig from cluster A
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      delegate_to: k8s-a-cp
      become: true
      register: kubeconfig_a

    - name: Slurp kubeconfig from cluster B
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      delegate_to: k8s-b-cp
      become: true
      register: kubeconfig_b

    - name: Write cluster A kubeconfig on mgmt
      ansible.builtin.copy:
        dest: "{{ kube_dir }}/k3s-a.yaml"
        content: "{{ kubeconfig_a.content | b64decode | replace('127.0.0.1', hostvars['k8s-a-cp'].k3s_cp_api_ip) }}"
        mode: "0600"

    - name: Write cluster B kubeconfig on mgmt
      ansible.builtin.copy:
        dest: "{{ kube_dir }}/k3s-b.yaml"
        content: "{{ kubeconfig_b.content | b64decode | replace('127.0.0.1', hostvars['k8s-b-cp'].k3s_cp_api_ip) }}"
        mode: "0600"

- name: Configure mgmt and CSR routes for Cilium LoadBalancer pools
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: Persist mgmt routes to Cilium LoadBalancer pools
      ansible.builtin.copy:
        dest: /etc/netplan/60-cilium-lb-routes.yaml
        mode: "0644"
        content: |
          network:
            version: 2
            ethernets:
              ens2:
                routes:
                  - to: 10.110.0.0/24
                    via: 198.18.1.31
                  - to: 10.120.0.0/24
                    via: 198.18.1.32
      become: true
      register: mgmt_lb_routes

    - name: Apply mgmt LoadBalancer pool routes
      ansible.builtin.command: netplan apply
      become: true
      changed_when: true
      when: mgmt_lb_routes.changed

    - name: Ensure current mgmt route to cluster A LoadBalancer pool
      ansible.builtin.command: ip route replace 10.110.0.0/24 via 198.18.1.31
      become: true
      changed_when: true

    - name: Ensure current mgmt route to cluster B LoadBalancer pool
      ansible.builtin.command: ip route replace 10.120.0.0/24 via 198.18.1.32
      become: true
      changed_when: true

    - name: Configure CSR-A route to cluster A LoadBalancer pool
      ansible.builtin.shell: |
        set -e
        printf '%s\n' \
          'configure terminal' \
          'ip route 10.110.0.0 255.255.255.0 10.10.0.11' \
          'end' \
          'write memory' |
          sshpass -p cisco ssh -tt \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o PreferredAuthentications=password \
              -o NumberOfPasswordPrompts=0 \
              cisco@198.18.1.31
      args:
        executable: /bin/bash
      register: csr_a_lb_route
      changed_when: csr_a_lb_route.rc == 0
      failed_when: false

    - name: Configure CSR-B route to cluster B LoadBalancer pool
      ansible.builtin.shell: |
        set -e
        printf '%s\n' \
          'configure terminal' \
          'ip route 10.120.0.0 255.255.255.0 10.20.0.11' \
          'end' \
          'write memory' |
          sshpass -p cisco ssh -tt \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o PreferredAuthentications=password \
              -o NumberOfPasswordPrompts=0 \
              cisco@198.18.1.32
      args:
        executable: /bin/bash
      register: csr_b_lb_route
      changed_when: csr_b_lb_route.rc == 0
      failed_when: false

    - name: Show CSR route configuration status
      ansible.builtin.debug:
        msg:
          - "CSR-A route task rc={{ csr_a_lb_route.rc }}; if non-zero, configure manually: ip route 10.110.0.0 255.255.255.0 10.10.0.11"
          - "CSR-B route task rc={{ csr_b_lb_route.rc }}; if non-zero, configure manually: ip route 10.120.0.0 255.255.255.0 10.20.0.11"

- name: Install Helm on mgmt
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: Download Helm install script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm-3
        mode: "0755"

    - name: Install Helm 3 to /usr/local/bin
      ansible.builtin.command: /tmp/get-helm-3
      args:
        creates: /usr/local/bin/helm

- name: Prepare Cilium Helm repo
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    cilium_chart_archive: "/tmp/cilium-{{ cilium_helm_chart_version }}.tgz"
  tasks:
    - name: Add and update Cilium Helm repo
      ansible.builtin.shell: |
        set -e
        helm repo add cilium https://helm.cilium.io/ 2>/dev/null || true
        helm repo update
      changed_when: true

    - name: Pull Cilium Helm chart archive
      ansible.builtin.command:
        argv:
          - helm
          - pull
          - cilium/cilium
          - --version
          - "{{ cilium_helm_chart_version }}"
          - --destination
          - /tmp
        creates: "{{ cilium_chart_archive }}"
      register: cilium_chart_pull
      until: cilium_chart_pull.rc == 0
      retries: 6
      delay: 10

- name: Install Cilium and BGP resources
  hosts: k8s_control
  gather_facts: false
  become: false
  vars:
    kube_cfg: "/home/cisco/.kube/{{ 'k3s-a.yaml' if inventory_hostname == 'k8s-a-cp' else 'k3s-b.yaml' }}"
    cilium_chart_archive: "/tmp/cilium-{{ cilium_helm_chart_version }}.tgz"
    cilium_values_file: "/tmp/cilium-values-{{ inventory_hostname }}.yaml"
    cilium_bgp_resources_file: "/tmp/cilium-bgp-{{ inventory_hostname }}.yaml"
  tasks:
    - name: Write Cilium Helm values
      ansible.builtin.copy:
        dest: "{{ cilium_values_file }}"
        mode: "0644"
        content: |
          cluster:
            name: {{ cilium_cluster_name }}
            id: {{ cilium_cluster_id }}
          kubeProxyReplacement: true
          ipam:
            mode: cluster-pool
            operator:
              clusterPoolIPv4PodCIDRList:
                - {{ k3s_cluster_cidr }}
              clusterPoolIPv4MaskSize: {{ cilium_cluster_pool_ipv4_mask_size }}
          routingMode: tunnel
          tunnelProtocol: vxlan
          autoDirectNodeRoutes: false
          bgpControlPlane:
            enabled: true
          k8sServiceHost: {{ k3s_cp_api_ip }}
          k8sServicePort: 6443
          hubble:
            enabled: true
            relay:
              enabled: true
            ui:
              enabled: true
              service:
                type: LoadBalancer
      delegate_to: localhost

    - name: Render Cilium chart and collect exact Cilium image references
      ansible.builtin.shell: |
        set -euo pipefail
        helm template cilium "{{ cilium_chart_archive }}" \
          --namespace kube-system \
          --values "{{ cilium_values_file }}" |
          awk '/image:/ { gsub(/"/, "", $2); print $2 }' |
          grep -E 'quay.io/cilium/(cilium|cilium-envoy|operator)' |
          sort -u
      args:
        executable: /bin/bash
      register: cilium_prepull_images
      changed_when: false
      delegate_to: localhost

    - name: Show Cilium images selected for pre-pull
      ansible.builtin.debug:
        var: cilium_prepull_images.stdout_lines

    - name: Pre-pull Cilium images on control plane with K3s containerd
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - ctr
          - --namespace
          - k8s.io
          - images
          - pull
          - "{{ item }}"
      become: true
      loop: "{{ cilium_prepull_images.stdout_lines }}"

    - name: Verify pre-pulled Cilium images are in K3s containerd
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/local/bin/k3s ctr --namespace k8s.io images ls | grep -F "{{ item }}"
      args:
        executable: /bin/bash
      become: true
      changed_when: false
      loop: "{{ cilium_prepull_images.stdout_lines }}"

    - name: Reconcile Cilium Helm release
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - cilium
          - "{{ cilium_chart_archive }}"
          - --namespace
          - kube-system
          - --create-namespace
          - --values
          - "{{ cilium_values_file }}"
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      delegate_to: localhost

    - name: Wait for Cilium CRDs needed by lab resources
      ansible.builtin.command: kubectl wait --for=condition=Established --timeout=300s crd/{{ item }}
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      loop:
        - ciliumloadbalancerippools.cilium.io
        - ciliumbgpclusterconfigs.cilium.io
        - ciliumbgppeerconfigs.cilium.io
        - ciliumbgpadvertisements.cilium.io
      delegate_to: localhost

    - name: Write Cilium BGP control plane resources
      ansible.builtin.copy:
        dest: "{{ cilium_bgp_resources_file }}"
        mode: "0644"
        content: |
          apiVersion: cilium.io/v2alpha1
          kind: CiliumLoadBalancerIPPool
          metadata:
            name: lb-pool
          spec:
            blocks:
              - start: "{{ cilium_lb_pool_start }}"
                stop: "{{ cilium_lb_pool_stop }}"
          ---
          apiVersion: cilium.io/v2
          kind: CiliumBGPPeerConfig
          metadata:
            name: csr-peer
          spec:
            families:
              - afi: ipv4
                safi: unicast
                advertisements:
                  matchLabels:
                    advertise: bgp
          ---
          apiVersion: cilium.io/v2
          kind: CiliumBGPClusterConfig
          metadata:
            name: csr-router
          spec:
            nodeSelector:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: Exists
            bgpInstances:
              - name: instance-{{ cilium_bgp_local_asn }}
                localASN: {{ cilium_bgp_local_asn }}
                peers:
                  - name: csr-router
                    peerASN: {{ cilium_bgp_peer_asn }}
                    peerAddress: {{ cilium_bgp_peer_address }}
                    peerConfigRef:
                      name: csr-peer
          ---
          apiVersion: cilium.io/v2
          kind: CiliumBGPAdvertisement
          metadata:
            name: lab-advertisements
            labels:
              advertise: bgp
          spec:
            advertisements:
              - advertisementType: PodCIDR
              - advertisementType: Service
                service:
                  addresses:
                    - ClusterIP
                    - LoadBalancerIP
                selector:
                  matchExpressions:
                    - key: somekey
                      operator: NotIn
                      values:
                        - never-used-value
      delegate_to: localhost

    - name: Apply Cilium BGP control plane resources
      ansible.builtin.command: kubectl apply -f "{{ cilium_bgp_resources_file }}"
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      register: cilium_bgp_apply
      changed_when: "'created' in cilium_bgp_apply.stdout or 'configured' in cilium_bgp_apply.stdout"
      delegate_to: localhost

    - name: Wait for Cilium DaemonSet ready
      ansible.builtin.command: kubectl rollout status daemonset/cilium -n kube-system --timeout=1800s
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      delegate_to: localhost

    - name: Wait for Hubble Relay ready
      ansible.builtin.command: kubectl rollout status deployment/hubble-relay -n kube-system --timeout=1800s
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      delegate_to: localhost

    - name: Wait for Hubble UI ready
      ansible.builtin.command: kubectl rollout status deployment/hubble-ui -n kube-system --timeout=1800s
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      delegate_to: localhost

- name: Install curl target on site A
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    kube_cfg: /home/cisco/.kube/k3s-a.yaml
    curl_target_manifest: /tmp/curl-target-site-a.yaml
  tasks:
    - name: Write curl target manifest for site A
      ansible.builtin.copy:
        dest: "{{ curl_target_manifest }}"
        mode: "0644"
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: curl-target-nginx
          data:
            default.conf: |
              server {
                listen 8080;
                server_name _;

                location / {
                  default_type text/plain;
                  return 200 "curl-target\n";
                }
              }
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: curl-target
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: curl-target
            template:
              metadata:
                labels:
                  app: curl-target
              spec:
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: nginx
                    image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
                    imagePullPolicy: IfNotPresent
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    ports:
                      - containerPort: 8080
                    volumeMounts:
                      - name: nginx-config
                        mountPath: /etc/nginx/conf.d/default.conf
                        subPath: default.conf
                        readOnly: true
                volumes:
                  - name: nginx-config
                    configMap:
                      name: curl-target-nginx
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: curl-target
          spec:
            type: ClusterIP
            selector:
              app: curl-target
            ports:
              - name: http
                port: 80
                targetPort: 8080

    - name: Apply curl target manifest to site A
      ansible.builtin.command: kubectl apply -f "{{ curl_target_manifest }}"
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      register: curl_target_apply
      changed_when: "'created' in curl_target_apply.stdout or 'configured' in curl_target_apply.stdout"

    - name: Wait for site A curl target deployment
      ansible.builtin.command: kubectl rollout status deployment/curl-target --timeout=300s
      environment:
        KUBECONFIG: "{{ kube_cfg }}"

- name: Validate clusters from mgmt
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    kube_dir: /home/cisco/.kube
  tasks:
    - name: Show cluster A nodes
      ansible.builtin.command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: "{{ kube_dir }}/k3s-a.yaml"
      register: k3s_nodes_a
      changed_when: false

    - name: Show cluster B nodes
      ansible.builtin.command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: "{{ kube_dir }}/k3s-b.yaml"
      register: k3s_nodes_b
      changed_when: false

    - name: Show Cilium BGP resources in cluster A
      ansible.builtin.command: kubectl get ciliumbgpclusterconfigs,ciliumbgppeerconfigs,ciliumbgpadvertisements
      environment:
        KUBECONFIG: "{{ kube_dir }}/k3s-a.yaml"
      register: cilium_bgp_a
      changed_when: false

    - name: Show Cilium BGP resources in cluster B
      ansible.builtin.command: kubectl get ciliumbgpclusterconfigs,ciliumbgppeerconfigs,ciliumbgpadvertisements
      environment:
        KUBECONFIG: "{{ kube_dir }}/k3s-b.yaml"
      register: cilium_bgp_b
      changed_when: false

    - name: Display validation summary
      ansible.builtin.debug:
        msg:
          - "=== Cluster A nodes ==="
          - "{{ k3s_nodes_a.stdout }}"
          - "=== Cluster A Cilium BGP ==="
          - "{{ cilium_bgp_a.stdout }}"
          - "=== Cluster B nodes ==="
          - "{{ k3s_nodes_b.stdout }}"
          - "=== Cluster B Cilium BGP ==="
          - "{{ cilium_bgp_b.stdout }}"
