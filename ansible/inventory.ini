# Lab inventory: run playbooks from jump-1 (e.g. cd to this directory, then ansible-playbook site.yml).
# Default SSH: user cisco, password in group_vars/all.yml (CML Ubuntu image).
# Host IPs align with lab/topology.yaml (198.18.1.0/24 lab plan).

[jump]
jump-1 ansible_host=198.18.1.20 ansible_connection=local

[k8s_a_control]
k8s-a-cp ansible_host=198.18.1.40 k3s_cp_api_ip=198.18.1.40 k3s_cluster_cidr=10.42.0.0/16 k3s_service_cidr=10.52.0.0/16 cilium_cluster_name=k8s-a cilium_cluster_id=1

[k8s_a_workers]
k8s-a-w1 ansible_host=198.18.1.41 k3s_cp_api_ip=198.18.1.40
k8s-a-w2 ansible_host=198.18.1.42 k3s_cp_api_ip=198.18.1.40

[k8s_b_control]
k8s-b-cp ansible_host=198.18.1.70 k3s_cp_api_ip=198.18.1.70 k3s_cluster_cidr=10.43.0.0/16 k3s_service_cidr=10.53.0.0/16 cilium_cluster_name=k8s-b cilium_cluster_id=2

[k8s_b_workers]
k8s-b-w1 ansible_host=198.18.1.71 k3s_cp_api_ip=198.18.1.70
k8s-b-w2 ansible_host=198.18.1.72 k3s_cp_api_ip=198.18.1.70

[k8s_control:children]
k8s_a_control
k8s_b_control

[k8s_workers:children]
