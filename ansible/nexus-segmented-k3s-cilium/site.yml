---
- name: Wait for SSH on Ubuntu lab nodes from jump
  hosts: ubuntu_lab:!mgmt_nodes
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Wait for port 22
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        delay: 0
        sleep: 5
        timeout: 1200
      delegate_to: localhost

- name: Linux prep for k3s nodes
  hosts: k8s_nodes
  become: true
  tasks:
    - name: Ensure kernel modules for Kubernetes
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Load modules now
      ansible.builtin.command: modprobe {{ item }}
      changed_when: true
      failed_when: false
      loop:
        - overlay
        - br_netfilter

    - name: Sysctl for Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        mode: "0644"

    - name: Apply sysctl
      ansible.builtin.command: sysctl -p /etc/sysctl.d/99-kubernetes.conf
      changed_when: true

    - name: Disable swap
      ansible.builtin.command: swapoff -a
      changed_when: true
      failed_when: false

    - name: Remove swap from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        state: absent
        regexp: '^[^#]*\sswap\s'

    - name: Ensure K3s config directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Enable K3s distributed registry mirroring for all registries
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/registries.yaml
        content: |
          mirrors:
            "*":
        mode: "0644"
      register: k3s_registries_yaml

    - name: Restart K3s services when registry mirror config changes
      ansible.builtin.shell: |
        systemctl try-restart k3s || true
        systemctl try-restart k3s-agent || true
      changed_when: true
      when: k3s_registries_yaml.changed

- name: Install K3s server for Cilium
  hosts: k8s_control
  become: true
  tasks:
    - name: Install K3s server without bundled CNI or kube-proxy
      ansible.builtin.shell: |
        set -e
        curl -sfL https://get.k3s.io | sh -s - server \
          --flannel-backend=none \
          --disable-network-policy \
          --disable-kube-proxy \
          --disable=traefik,servicelb \
          --cluster-cidr={{ k3s_cluster_cidr }} \
          --service-cidr={{ k3s_service_cidr }} \
          --node-ip={{ ansible_host }} \
          --advertise-address={{ ansible_host }} \
          --tls-san={{ ansible_host }} \
          --write-kubeconfig-mode=0644 \
          --embedded-registry \
          --kubelet-arg=serialize-image-pulls=true
      args:
        creates: /etc/systemd/system/k3s.service

    - name: Enable and start k3s
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

- name: Wait for Kubernetes API
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: Wait for k3s API
      ansible.builtin.wait_for:
        host: "{{ hostvars['k8s-cp'].k3s_cp_api_ip }}"
        port: 6443
        timeout: 300

- name: Read K3s join token
  hosts: k8s_control
  gather_facts: false
  become: true
  tasks:
    - name: Slurp node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_slurp

    - name: Publish token as host fact for workers
      ansible.builtin.set_fact:
        k3s_join_token: "{{ k3s_token_slurp.content | b64decode | trim }}"

- name: Join K3s agents
  hosts: k8s_workers
  become: true
  vars:
    k3s_join_token: "{{ hostvars['k8s-cp']['k3s_join_token'] }}"
  tasks:
    - name: Install K3s agent
      ansible.builtin.shell: |
        set -e
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ k3s_cp_api_ip }}:6443 K3S_TOKEN="{{ k3s_join_token }}" sh -s - agent \
          --node-ip={{ ansible_host }} \
          --kubelet-arg=serialize-image-pulls=true
      args:
        creates: /etc/systemd/system/k3s-agent.service

    - name: Enable and start k3s-agent
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: started

- name: Install PostgreSQL on the database node
  hosts: databases
  become: true
  tasks:
    - name: Check for dedicated PostgreSQL disk
      ansible.builtin.stat:
        path: "{{ postgres_data_device }}"
      register: postgres_disk

    - name: Check for PostgreSQL partition
      ansible.builtin.stat:
        path: "{{ postgres_data_device }}1"
      register: postgres_partition
      when: postgres_disk.stat.exists

    - name: Partition dedicated PostgreSQL disk
      ansible.builtin.command: parted --script {{ postgres_data_device }} mklabel gpt mkpart primary ext4 0% 100%
      changed_when: true
      when:
        - postgres_disk.stat.exists
        - not (postgres_partition.stat.exists | default(false))

    - name: Wait for PostgreSQL partition device
      ansible.builtin.wait_for:
        path: "{{ postgres_data_device }}1"
        timeout: 30
      when: postgres_disk.stat.exists

    - name: Check PostgreSQL filesystem
      ansible.builtin.command: blkid {{ postgres_data_device }}1
      register: postgres_partition_blkid
      changed_when: false
      failed_when: false
      when: postgres_disk.stat.exists

    - name: Create PostgreSQL filesystem
      ansible.builtin.command: mkfs.ext4 -F {{ postgres_data_device }}1
      changed_when: true
      when:
        - postgres_disk.stat.exists
        - postgres_partition_blkid.rc != 0

    - name: Ensure PostgreSQL mount point exists
      ansible.builtin.file:
        path: "{{ postgres_data_mount }}"
        state: directory
        mode: "0755"

    - name: Mount dedicated PostgreSQL disk
      ansible.posix.mount:
        path: "{{ postgres_data_mount }}"
        src: "{{ postgres_data_device }}1"
        fstype: ext4
        opts: defaults,nofail
        state: mounted
      when: postgres_disk.stat.exists

    - name: Install PostgreSQL packages
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
        state: present
        update_cache: true

    - name: Find PostgreSQL major version directory
      ansible.builtin.find:
        paths: /etc/postgresql
        file_type: directory
        depth: 1
      register: postgres_versions

    - name: Configure PostgreSQL listen address
      ansible.builtin.lineinfile:
        path: "{{ (postgres_versions.files | sort(attribute='path') | last).path }}/main/postgresql.conf"
        regexp: "^#?listen_addresses ="
        line: "listen_addresses = '{{ ansible_host }}'"
      notify: Restart PostgreSQL

    - name: Permit worker subnet to reach PostgreSQL
      ansible.builtin.lineinfile:
        path: "{{ (postgres_versions.files | sort(attribute='path') | last).path }}/main/pg_hba.conf"
        line: "host    all     all     198.18.1.0/24     scram-sha-256"
      notify: Restart PostgreSQL

    - name: Enable and start PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        enabled: true
        state: started

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        state: restarted

- name: Install kubectl, Helm, and Cilium CLI on jump
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    kube_dir: /home/cisco/.kube
  tasks:
    - name: Detect architecture
      ansible.builtin.command: uname -m
      register: mgmt_uname_m
      changed_when: false

    - name: Set download architecture
      ansible.builtin.set_fact:
        linux_dl_arch: "{{ 'arm64' if mgmt_uname_m.stdout in ['aarch64', 'arm64'] else 'amd64' }}"

    - name: Fetch kubectl stable version
      ansible.builtin.uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: true
      register: kubectl_stable_ver

    - name: Install kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_stable_ver.content | trim }}/bin/linux/{{ linux_dl_arch }}/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"
      become: true

    - name: Download Helm install script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm-3
        mode: "0755"

    - name: Install Helm 3
      ansible.builtin.command: /tmp/get-helm-3
      args:
        creates: /usr/local/bin/helm
      become: true

    - name: Download Cilium CLI tarball
      ansible.builtin.get_url:
        url: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}/cilium-linux-{{ linux_dl_arch }}.tar.gz"
        dest: /tmp/cilium-cli.tar.gz
        mode: "0644"

    - name: Extract Cilium CLI
      ansible.builtin.unarchive:
        src: /tmp/cilium-cli.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install Cilium CLI
      ansible.builtin.copy:
        src: /tmp/cilium
        dest: /usr/local/bin/cilium
        mode: "0755"
        remote_src: true
      become: true

    - name: Ensure kubeconfig directory
      ansible.builtin.file:
        path: "{{ kube_dir }}"
        state: directory
        mode: "0700"

    - name: Slurp kubeconfig from control plane
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      delegate_to: k8s-cp
      become: true
      register: kubeconfig

    - name: Write kubeconfig on jump
      ansible.builtin.copy:
        dest: "{{ kube_dir }}/cml-k3s.yaml"
        content: "{{ kubeconfig.content | b64decode | replace('127.0.0.1', hostvars['k8s-cp'].k3s_cp_api_ip) }}"
        mode: "0600"

    - name: Add and update Cilium Helm repo
      ansible.builtin.shell: |
        set -e
        helm repo add cilium https://helm.cilium.io/ 2>/dev/null || true
        helm repo update
      changed_when: true

- name: Install Cilium, LB IPAM, and L2 announcements
  hosts: k8s_control
  gather_facts: false
  become: false
  vars:
    kube_cfg: /home/cisco/.kube/cml-k3s.yaml
    cilium_values_file: /tmp/cilium-values-nexus.yaml
    cilium_resources_file: /tmp/cilium-nexus-lb-resources.yaml
  tasks:
    - name: Label worker nodes
      ansible.builtin.command: kubectl label node {{ item }} node-role.kubernetes.io/worker=true --overwrite
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      loop: "{{ groups['k8s_workers'] }}"
      delegate_to: localhost

    - name: Write Cilium Helm values
      ansible.builtin.copy:
        dest: "{{ cilium_values_file }}"
        mode: "0644"
        content: |
          cluster:
            name: {{ cilium_cluster_name }}
            id: {{ cilium_cluster_id }}
          kubeProxyReplacement: true
          k8sServiceHost: {{ k3s_cp_api_ip }}
          k8sServicePort: 6443
          ipam:
            mode: cluster-pool
            operator:
              clusterPoolIPv4PodCIDRList:
                - {{ cilium_cluster_pool_ipv4_cidr }}
              clusterPoolIPv4MaskSize: {{ cilium_cluster_pool_ipv4_mask_size }}
          routingMode: tunnel
          tunnelProtocol: vxlan
          autoDirectNodeRoutes: false
          l2announcements:
            enabled: true
          k8sClientRateLimit:
            qps: 20
            burst: 40
          hubble:
            enabled: true
            relay:
              enabled: true
            ui:
              enabled: true
              service:
                type: LoadBalancer
          operator:
            replicas: 1
      delegate_to: localhost

    - name: Render Cilium chart and collect image references
      ansible.builtin.shell: |
        set -euo pipefail
        helm template cilium cilium/cilium \
          --version "{{ cilium_helm_chart_version }}" \
          --namespace kube-system \
          --values "{{ cilium_values_file }}" |
          awk '/image:/ { gsub(/"/, "", $2); print $2 }' |
          grep -E '^(quay.io|docker.io|ghcr.io|registry.k8s.io)/' |
          sort -u
      args:
        executable: /bin/bash
      register: cilium_prepull_images
      changed_when: false
      delegate_to: localhost

    - name: Show Cilium images selected for pre-pull
      ansible.builtin.debug:
        var: cilium_prepull_images.stdout_lines

    - name: Pre-pull Cilium images on each k3s node
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - ctr
          - --namespace
          - k8s.io
          - images
          - pull
          - "{{ item.1 }}"
      become: true
      delegate_to: "{{ item.0 }}"
      loop: "{{ groups['k8s_nodes'] | product(cilium_prepull_images.stdout_lines) | list }}"

    - name: Reconcile Cilium Helm release
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - cilium
          - cilium/cilium
          - --version
          - "{{ cilium_helm_chart_version }}"
          - --namespace
          - kube-system
          - --create-namespace
          - --values
          - "{{ cilium_values_file }}"
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      delegate_to: localhost

    - name: Wait for Cilium CRDs needed by lab resources
      ansible.builtin.command: kubectl wait --for=condition=Established --timeout=300s crd/{{ item }}
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      loop:
        - ciliumloadbalancerippools.cilium.io
        - ciliuml2announcementpolicies.cilium.io
      delegate_to: localhost

    - name: Write Cilium LoadBalancer and L2 announcement resources
      ansible.builtin.copy:
        dest: "{{ cilium_resources_file }}"
        mode: "0644"
        content: |
          apiVersion: cilium.io/v2alpha1
          kind: CiliumLoadBalancerIPPool
          metadata:
            name: nexus-public-workload-pool
          spec:
            blocks:
              - start: "{{ cilium_lb_pool_start }}"
                stop: "{{ cilium_lb_pool_stop }}"
          ---
          apiVersion: cilium.io/v2alpha1
          kind: CiliumL2AnnouncementPolicy
          metadata:
            name: nexus-public-worker-l2
          spec:
            nodeSelector:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
            interfaces:
              - ^eth[0-9]+
              - ^ens[0-9]+
            loadBalancerIPs: true
      delegate_to: localhost

    - name: Apply Cilium LoadBalancer and L2 announcement resources
      ansible.builtin.command: kubectl apply -f "{{ cilium_resources_file }}"
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      register: cilium_resources_apply
      changed_when: "'created' in cilium_resources_apply.stdout or 'configured' in cilium_resources_apply.stdout"
      delegate_to: localhost

    - name: Wait for Cilium DaemonSet ready
      ansible.builtin.command: kubectl rollout status daemonset/cilium -n kube-system --timeout=1800s
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      delegate_to: localhost

    - name: Wait for Hubble Relay ready
      ansible.builtin.command: kubectl rollout status deployment/hubble-relay -n kube-system --timeout=1800s
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      delegate_to: localhost

- name: Validate Nexus-segmented cluster from jump
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    kube_cfg: /home/cisco/.kube/cml-k3s.yaml
  tasks:
    - name: Show Kubernetes nodes
      ansible.builtin.command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      register: k3s_nodes
      changed_when: false

    - name: Show Cilium service exposure resources
      ansible.builtin.command: kubectl get ciliumloadbalancerippools,ciliuml2announcementpolicies
      environment:
        KUBECONFIG: "{{ kube_cfg }}"
      register: cilium_exposure_resources
      changed_when: false

    - name: Display validation summary
      ansible.builtin.debug:
        msg:
          - "=== Kubernetes nodes ==="
          - "{{ k3s_nodes.stdout }}"
          - "=== Cilium LoadBalancer and L2 resources ==="
          - "{{ cilium_exposure_resources.stdout }}"
