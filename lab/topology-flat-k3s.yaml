    n1: n0
    n2: n1
    i1: i0
    i2: i0
    conditioning: {}
    label: external-port<->lab-sw-port0
  - id: l1
    n1: n1
    n2: n2
    i1: i1
    i2: i0
    conditioning: {}
    label: lab-sw-port1<->mgmt-ens2
  - id: l2
    n1: n1
    n2: n3
    i1: i2
    i2: i0
    conditioning: {}
    label: lab-sw-port2<->k8s-cp-ens2
