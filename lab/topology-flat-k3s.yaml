    n2: n5
    i1: i4
    i2: i0
    conditioning: {}
    label: lab-sw-port4<->k8s-w2-ens2

lab:
  description: >-
    Flat K3s topology with four Ubuntu nodes on 198.18.1.0/24 through an unmanaged switch and bridge1 external connector.
    mgmt installs Ansible, clones the latest repository from main, and runs ansible/flat-k3s/site.yml to install one K3s
    control plane and two workers.
  notes: >-
    Start all nodes together or start mgmt after the K3s nodes begin booting. mgmt waits for SSH on 198.18.1.11-13 before
    running Ansible. All Ubuntu nodes use 198.18.133.1 for DNS and 198.18.1.1 as the default gateway.
  title: 'Flat K3s Lab'
  version: 0.1.0
