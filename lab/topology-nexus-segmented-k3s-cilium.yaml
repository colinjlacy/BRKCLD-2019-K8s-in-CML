        content: |-
          #cloud-config
          system_info:
            default_user:
              name: cisco
          password: cisco
          ssh_pwauth: true
          chpasswd:
            expire: false
          hostname: jump-1
          manage_etc_hosts: false
          apt:
            preserve_sources_list: false
            primary:
              - arches: [default]
                uri: http://mirrors.kernel.org/ubuntu
            security:
              - arches: [default]
                uri: http://mirrors.kernel.org/ubuntu
          write_files:
            - path: /etc/cloud/cloud.cfg.d/99-lab-disable-cloud-init-network.cfg
              permissions: "0644"
              content: |
                network:
                  config: disabled
            - path: /etc/netplan/50-cloud-init.yaml
              permissions: "0644"
              content: |
                network:
                  version: 2
                  ethernets:
                    ens2:
                      dhcp4: false
                      dhcp6: false
                      addresses:
                        - 10.10.10.10/24
                      routes:
                        - to: default
                          via: 10.10.10.1
                      nameservers:
                        addresses:
                          - 198.18.133.1
                          - 1.1.1.1
            - path: /etc/hosts
              append: true
              content: |
                # Nexus segmented K3s + Cilium lab
                10.10.10.10   jump-1
                10.10.30.10   k8s-cp
                198.18.1.21   k8s-w1
                198.18.1.22   k8s-w2
                10.10.40.10   postgres-1
          runcmd:
            - netplan apply
            - systemctl try-restart systemd-resolved || true
            - DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 update
            - DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y ansible git curl jq openssh-client python3 python3-pip sshpass
