lab:
  description: >-
    One K3s cluster behind a Nexus 9000v segmentation point. Workers and Cilium LoadBalancer IPs live on 198.18.1.0/24 while the
    control plane and PostgreSQL node live on protected VLANs. Cilium uses VXLAN tunnel mode and L2 announcements for public service VIPs.
  notes: >-
    Start external and n9k-fabric first, then start jump-1 and the Ubuntu workload nodes. From jump-1, run
    ansible-playbook ansible/nexus-segmented-k3s-cilium/site.yml after the repository is available. The Nexus ACL permits return traffic
    for outbound package and image pulls but blocks new external-connector sessions into the management, control-plane, and database VLANs.
    DNS uses upstream resolvers directly; no lab DNS cache is deployed.
  title: 'Nexus Segmented K3s Cilium Lab'
  version: 0.1.0
