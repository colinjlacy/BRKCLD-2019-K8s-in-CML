# Cisco Modeling Labs (CML) 2.x Lab Topology
# Nexus-segmented K3s + Cilium lab: one NX-OS fabric node segments management, control-plane, database, and public workload VLANs.

annotations: []
nodes:
  - boot_disk_size: null
    configuration:
      - name: default
        content: bridge1
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n0
    image_definition: null
    label: external
    node_definition: external_connector
    parameters: {}
    ram: null
    tags: []
    x: -400
    y: -80
    interfaces:
      - id: i0
        label: port
        slot: 0
        type: physical
  - boot_disk_size: null
    configuration:
      - name: nxos_config.txt
        content: |-
          hostname n9k-fabric
          feature interface-vlan
          feature ssh
          ip routing
          vlan 10
            name MGMT
          vlan 30
            name K8S_CONTROL_PLANE
          vlan 40
            name DATABASE
          vlan 198
            name PUBLIC_WORKLOAD
          interface Vlan10
            description MGMT default gateway
            no shutdown
            ip address 10.10.10.1/24
          interface Vlan30
            description K8S control-plane default gateway
            no shutdown
            ip address 10.10.30.1/24
          interface Vlan40
            description Database default gateway
            no shutdown
            ip address 10.10.40.1/24
          interface Vlan198
            description Public worker and LoadBalancer gateway
            no shutdown
            ip address 198.18.1.254/24
          ip route 0.0.0.0/0 198.18.1.1
          ip access-list ACL-EXT-IN
            10 remark Permit return traffic for lab-initiated package and image downloads
            11 permit tcp any 10.10.10.0/24 established
            12 permit tcp any 10.10.30.0/24 established
            13 permit tcp any 10.10.40.0/24 established
            14 permit udp any eq domain 10.10.10.0/24
            15 permit udp any eq domain 10.10.30.0/24
            16 permit udp any eq domain 10.10.40.0/24
            20 remark External connector must not initiate access to protected segments
            30 deny ip any 10.10.10.0/24
            40 deny ip any 10.10.30.0/24
            50 deny ip any 10.10.40.0/24
            90 permit ip any any
          ip access-list ACL-WORKER-IN
            10 remark Worker ports may reach the API, Cilium VXLAN, and database service
            20 permit tcp any host 10.10.30.10 eq 6443
            30 permit udp any host 10.10.30.10 eq 8472
            40 permit tcp any host 10.10.40.10 eq 5432
            50 permit icmp any 10.10.30.0/24
            60 permit icmp any 10.10.40.0/24
            70 deny ip any 10.10.10.0/24
            80 deny ip any 10.10.30.0/24
            90 deny ip any 10.10.40.0/24
            100 permit ip any any
          ip access-list ACL-MGMT-IN
            10 remark Management node may administer lab nodes
            20 permit tcp any 198.18.1.0/24 eq 22
            30 permit tcp any host 10.10.30.10 eq 22
            40 permit tcp any host 10.10.30.10 eq 6443
            50 permit tcp any host 10.10.40.10 eq 22
            60 permit tcp any host 10.10.40.10 eq 5432
            70 permit icmp any any
            90 permit ip any any
          interface Ethernet1/1
            description external_connector
            switchport
            switchport mode access
            switchport access vlan 198
            spanning-tree port type edge
            ip port access-group ACL-EXT-IN in
            no shutdown
          interface Ethernet1/2
            description jump-1
            switchport
            switchport mode access
            switchport access vlan 10
            spanning-tree port type edge
            ip port access-group ACL-MGMT-IN in
            no shutdown
          interface Ethernet1/3
            description k8s-cp
            switchport
            switchport mode access
            switchport access vlan 30
            spanning-tree port type edge
            no shutdown
          interface Ethernet1/4
            description k8s-w1
            switchport
            switchport mode access
            switchport access vlan 198
            spanning-tree port type edge
            ip port access-group ACL-WORKER-IN in
            no shutdown
          interface Ethernet1/5
            description k8s-w2
            switchport
            switchport mode access
            switchport access vlan 198
            spanning-tree port type edge
            ip port access-group ACL-WORKER-IN in
            no shutdown
          interface Ethernet1/6
            description postgres-1
            switchport
            switchport mode access
            switchport access vlan 40
            spanning-tree port type edge
            no shutdown
          interface Ethernet1/7
            description future-k3s-worker
            switchport
            switchport mode access
            switchport access vlan 198
            spanning-tree port type edge
            ip port access-group ACL-WORKER-IN in
            shutdown
          interface Ethernet1/8
            description future-k3s-worker
            switchport
            switchport mode access
            switchport access vlan 198
            spanning-tree port type edge
            ip port access-group ACL-WORKER-IN in
            shutdown
