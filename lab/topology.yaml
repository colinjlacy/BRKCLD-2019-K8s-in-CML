# Cisco Modeling Labs (CML) 2.x Lab Topology
# Format matches CML export: annotations, nodes list (id/label/node_definition/interfaces), links (n1/n2/i1/i2), lab.
# 13 nodes: 3 IOSv (wan-rtr + two site routers), 2 unmanaged switches, 1 External Connector, 1 jump host, 6 Linux.
# Limits: 30 GB RAM, 20 vCPU. jump-1 dnsmasq caches DNS for image pulls / apt (see /etc/dnsmasq.d/lab-dns-cache.conf).
# K8s nodes: cloud-init waits up to ~5m for 10.30.0.10:53, then symlinks /etc/resolv.conf to systemd-resolved's resolv.conf
# (not the stub) so containerd/Go use 10.30.0.10 directly; see lab notes for VM start order.

annotations: []
nodes:
  - boot_disk_size: null
    configuration:
      - name: default
        content: bridge1
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n0
    image_definition: null
    label: external
    node_definition: external_connector
    parameters: {}
    ram: null
    tags: []
    x: 150
    y: -150
    interfaces:
      - id: i0
        label: port
        slot: 0
        type: physical

  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |-
          hostname wan-rtr
          no ip domain lookup
          ip cef
          access-list 1 permit 10.10.0.0 0.0.0.255
          access-list 1 permit 10.20.0.0 0.0.0.255
          access-list 1 permit 10.30.0.0 0.0.0.255
          access-list 1 permit 10.255.0.0 0.0.0.3
          access-list 1 permit 10.255.0.4 0.0.0.3
          interface GigabitEthernet0/0
           description to jump-1 shared services
           ip address 10.30.0.1 255.255.255.0
           ip nat inside
           no shutdown
          interface GigabitEthernet0/1
           description to site-a-rtr WAN
           ip address 10.255.0.1 255.255.255.252
           ip nat inside
           no shutdown
          interface GigabitEthernet0/2
           description to site-b-rtr WAN
           ip address 10.255.0.5 255.255.255.252
           ip nat inside
           no shutdown
          interface GigabitEthernet0/3
           description to external/Internet transit
           ip address 198.18.1.14 255.255.255.0
           ip nat outside
           no shutdown
          ip route 0.0.0.0 0.0.0.0 198.18.1.1
          ip route 10.10.0.0 255.255.255.0 10.255.0.2
          ip route 10.20.0.0 255.255.255.0 10.255.0.6
          ip nat inside source list 1 interface GigabitEthernet0/3 overload
          router bgp 64512
           bgp router-id 10.255.0.1
           network 10.30.0.0 mask 255.255.255.0
           default-information originate
           neighbor 10.255.0.2 remote-as 64513
           neighbor 10.255.0.6 remote-as 64514
           no auto-summary
          line con 0
           logging synchronous
          line vty 0 4
           no login
           transport input ssh
          end
