                      nameservers:
                        addresses:
                          - 10.30.0.10
            - path: /etc/hosts
              append: true
              content: |
                # K8s lab - all nodes
                10.30.0.10   jump-1
                10.10.0.11   k8s-a-cp
                10.10.0.21   k8s-a-w1
                10.10.0.22   k8s-a-w2
                10.20.0.11   k8s-b-cp
                10.20.0.21   k8s-b-w1
                10.20.0.22   k8s-b-w2
          runcmd:
            - netplan apply
            - systemctl try-restart systemd-resolved || true
            - bash -c 'for i in $(seq 1 60); do timeout 2 bash -c "echo >/dev/tcp/10.30.0.10/53" 2>/dev/null && exit 0; sleep 5; done; exit 0'
            - ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
            - systemctl try-restart systemd-resolved || true
            - DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 update
            - DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y python3
