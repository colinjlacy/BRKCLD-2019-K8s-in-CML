lab:
  description: >-
    Two-site routed topology with WAN, external/Internet segment, site routers, one L2 switch per site (k8s LAN),
    jump host, and cluster nodes. WAN is single default exit. BGP between WAN and site routers. jump-1 runs dnsmasq
    as a DNS cache (10.30.0.10) with conservative EDNS sizing and ens2-only bind. All six Kubernetes nodes wait for
    TCP 53 on 10.30.0.10 (best-effort, up to ~5m) before apt, then point /etc/resolv.conf at
    /run/systemd/resolve/resolv.conf so containerd and Go use 10.30.0.10 (jump dnsmasq) on cluster nodes without the 127.0.0.53 stub; jump-1 netplan still lists 198.18.133.1 second so its own apt can resolve before dnsmasq is installed.
    jump-1 applies the same resolv.conf symlink after dnsmasq starts.
  notes: >-
    Suggested start order (CML YAML cannot enforce boot order; use staged Start in Workbench or API if needed):
    (1) external + site-a-sw + site-b-sw, (2) wan-rtr, (3) site-a-rtr + site-b-rtr — wait until IOS is up and Gi0/1 is up/up,
    (4) jump-1 first until cloud-init finishes dnsmasq (10.30.0.10:53 accepts TCP), (5) all six k8s nodes. K8s cloud-init
    waits up to ~5 minutes for the cache; without a second resolver in netplan, start jump before K8s nodes if you need apt during that window. Linux cloud-init expects
    default gateways on site routers to be live; if a site router shows one-way LAN behavior, restart that router after peers are up.
    jump-bootstrap waits up to WAIT_ALL_SSH_SEC (1800s) for SSH on all six nodes before Ansible; increase inside
    jump-bootstrap-k3s.sh if your hypervisor is very slow. PLAYBOOK_TIMEOUT_SEC remains 7200s (2h).
  title: 'K8s Networking Lab - Foundation'
  version: 0.3.1
