lab:
  description: >-
    Two independent K3s clusters behind CSR1000v routers. CSRs attach to the shared 198.18.1.0/24 segment for Internet access and
    peer with each other using eBGP. Cilium peers with each local CSR and advertises PodCIDRs plus ClusterIP and LoadBalancer service VIPs.
  notes: >-
    Start external, shared-sw, site switches, and CSRs first, then start mgmt and the Kubernetes nodes. mgmt waits for SSH on all six
    Kubernetes nodes, clones the repository, and runs ansible/csr-multicluster-k3s-cilium/site.yml. DNS uses 198.18.133.1 directly;
    no lab DNS cache is deployed. CSR node_definition is csr1000v and assumes interfaces GigabitEthernet1 for shared/external and
    GigabitEthernet2 for the site LAN.
  title: 'CSR Multicluster K3s Cilium Lab'
  version: 0.1.0
